name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# push が重なっても、後発のビルドを残す
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm check

      # pnpm 10 は依存の postinstall を無視するため、OGP 生成用ブラウザを明示導入する。
      - name: Install Playwright browser (for OGP export)
        run: pnpm --filter talks exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # wrangler-action は wrangler が無いと workspace のルートに pnpm add しようとして落ちるので、
      # ルートの devDependencies に入れた wrangler を直接呼ぶ。project-name は Cloudflare Pages のプロジェクト名に合わせる。
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/portfolio/dist --project-name=daitasu-talks --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
